<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>내 마음 기후 온도계 🌡️</title>
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0fdf4 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --yes-bg: #eff6ff;
      --yes-border: #3b82f6;
      --yes-text: #1d4ed8;
      --no-bg: #f8fafc;
      --no-border: #cbd5e1;
      --no-text: #334155;
      --shadow: 0 18px 40px -12px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg-grad);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      line-height: 1.55;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .screen {
      display: none;
      animation: fadeUp 0.35s ease forwards;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Intro Screen */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #047857;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 22px;
      word-break: keep-all;
    }

    .tier-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

      background: #f8fafc;
      border: 1px solid #e2e8f0;
