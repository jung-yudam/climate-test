<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 마음 기후 온도계 🌡️ | 한성 그린마인드</title>
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f0fdf4 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --yes-bg: #eff6ff;
      --yes-border: #3b82f6;
      --yes-text: #1d4ed8;
      --no-bg: #f8fafc;
      --no-border: #cbd5e1;
      --no-text: #334155;
      --shadow: 0 18px 40px -12px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg-grad);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      line-height: 1.55;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    .screen {
      display: none;
      animation: fadeUp 0.3s ease forwards;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #047857;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .signal-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .signal-chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
    }

    .signal-chip .emoji {
      font-size: 22px;
      display: block;
      margin-bottom: 4px;
    }

    .signal-chip .lbl {
      font-size: 12px;
      color: #334155;
      font-weight: 700;
    }

    .intro-box {
      background: #f8fafc;
      border-radius: 18px;
      padding: 16px;
      font-size: 14px;
      color: #334155;
      margin-bottom: 22px;
      word-break: keep-all;
      border: 1px solid #f1f5f9;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px -6px rgba(2, 132, 199, 0.45);
      transition: transform 0.15s ease;
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .meta-note {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 12px;
    }

    .admin-entry-wrap {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed #e2e8f0;
      text-align: center;
    }

    .admin-entry-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Quiz */
    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
